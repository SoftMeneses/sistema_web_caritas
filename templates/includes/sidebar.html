<div class="sidebar">

    <div class="sidebar-header text-center py-4">

        <i class="bi bi-heart-pulse-fill fs-1 text-white"></i>

        <h5 class="text-white mt-2 mb-0">

            Cáritas

        </h5>

        <small class="text-light">
            
            Sistema Web

        </small>

    </div>

    <hr class="text-secondary">

    <small class="sidebar-title">

        PRINCIPAL

    </small>

    <ul class="nav flex-column">

        <li class="nav-item">

            <a
                class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
                href="{% url 'core:dashboard' %}">

                <i class="bi bi-speedometer2 me-2"></i>

                <span>

                    Dashboard

                </span>

            </a>

        </li>

    </ul>

    <hr class="text-secondary">

    <small class="sidebar-title">

        GESTIÓN

    </small>

    <ul class="nav flex-column">

        {% if es_administrador %}

            <li class="nav-item">

                <a
                    class="nav-link {% if request.resolver_match.url_name == 'usuario_lista' %}active{% endif %}"
                    href="{% url 'seguridad:usuario_lista' %}">

                    <i class="bi bi-people-fill me-2"></i>

                    <span>

                        Usuarios

                    </span>

                </a>

            </li>

        {% endif %}

        <li class="nav-item">

            <a
                class="nav-link {% if request.resolver_match.url_name == 'programa_lista' or request.resolver_match.url_name == 'programa_crear' or request.resolver_match.url_name == 'programa_detalle' or request.resolver_match.url_name == 'programa_editar' %}active{% endif %}"
                href="{% url 'core:programa_lista' %}">

                <i class="bi bi-journal-check me-2"></i>

                <span>

                    Programas

                </span>

            </a>

        </li>

        <li class="nav-item">

            <a
                class="nav-link {% if request.resolver_match.url_name == 'actividad_lista' or request.resolver_match.url_name == 'actividad_crear' or request.resolver_match.url_name == 'actividad_detalle' or request.resolver_match.url_name == 'actividad_editar' %}active{% endif %}"
                href="{% url 'core:actividad_lista' %}">

                <i class="bi bi-calendar-event me-2"></i>

                <span>

                    Actividades

                </span>

            </a>

        </li>

        <li class="nav-item">

            <a
                class="nav-link {% if request.resolver_match.url_name == 'beneficiario_lista' or request.resolver_match.url_name == 'beneficiario_crear' or request.resolver_match.url_name == 'beneficiario_detalle' or request.resolver_match.url_name == 'beneficiario_editar' %}active{% endif %}"
                href="{% url 'core:beneficiario_lista' %}">

                <i class="bi bi-heart-pulse me-2"></i>

                <span>

                    Beneficiarios

                </span>

            </a>

        </li>

    </ul>

    <hr class="text-secondary">

    <small class="sidebar-title">

        INVENTARIO

    </small>

    <ul class="nav flex-column">

        <li class="nav-item">

            <a
                class="nav-link {% if request.resolver_match.url_name == 'insumo_lista' or request.resolver_match.url_name == 'insumo_crear' or request.resolver_match.url_name == 'insumo_detalle' or request.resolver_match.url_name == 'insumo_editar' %}active{% endif %}"
                href="{% url 'core:insumo_lista' %}">

                <i class="bi bi-box-seam me-2"></i>

                <span>

                    Insumos

                </span>

            </a>

        </li>

    </ul>

    <hr class="text-secondary">

    <small class="sidebar-title">

        ADMINISTRACIÓN

    </small>

    <ul class="nav flex-column">

        <li class="nav-item">

            <a
                class="nav-link {% if request.resolver_match.url_name == 'auditoria_lista' %}active{% endif %}"
                href="{% url 'core:auditoria_lista' %}">

                <i class="bi bi-clipboard-data me-2"></i>

                <span>

                    Auditoría
                    
                </span>

            </a>

        </li>

    </ul>

</div>
