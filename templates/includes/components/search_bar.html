<!--
==============================================================================
Componente: Search Bar

Descripción:
Barra de búsqueda reutilizable para los listados del sistema.

Parámetros:

placeholder : Texto del input.
button_url  : URL del botón principal (opcional).
button_text : Texto del botón principal.
button_icon : Icono Bootstrap.
==============================================================================
-->

<div class="search-bar">

    <form method="get"
          class="row g-3 align-items-center"
          action="">

        <div class="col">

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-search"
                       aria-hidden="true">
                    </i>

                </span>

                <label for="{{ search_id|default:'search_input' }}"
                       class="visually-hidden">

                    Buscar

                </label>

                <input
                    id="{{ search_id|default:'search_input' }}"
                    type="search"
                    name="{{ search_name|default:'q' }}"
                    class="form-control"
                    aria-label="Buscar"
                    autocomplete="off"
                    placeholder="{{ placeholder|default:'Buscar...' }}"
                    value="{{ search_value | default:'' }}">

            </div>

        </div>

        {% if show_status_filter %}

        <div class="col-md-3">
        
            <select
                name="status"
                class="form-select"
                onchange="this.form.submit()">
        
                <option
                    value="activo"
                    {% if status_value == "activo" %}selected{% endif %}>
        
                    Activos
        
                </option>
            
                <option
                    value="inactivo"
                    {% if status_value == "inactivo" %}selected{% endif %}>
            
                    Inactivos
            
                </option>
            
                <option
                    value="todos"
                    {% if status_value == "todos" %}selected{% endif %}>
            
                    Todos
            
                </option>
            
            </select>
        
        </div>
        
        {% endif %}

        {% if button_url %}

        <div class="col-auto">

            <a href="{{ button_url }}"
               class="btn btn-primary btn-icon">

                <i class="{{ button_icon|default:'bi bi-plus-circle' }}"
                   aria-hidden="true">
                </i>

                {{ button_text|default:"Nuevo" }}

            </a>

        </div>

        {% endif %}

    </form>

</div>
