<!--
==============================================================================
Componente: Confirm Modal

Descripción:
Modal reutilizable para confirmar acciones críticas del sistema.

Parámetros esperados:

modal_id      : Identificador único del modal.
title         : Título del modal.
message       : Mensaje de confirmación.
confirm_url   : URL de la acción.
confirm_text  : Texto del botón principal.
confirm_class : Clase Bootstrap del botón.

==============================================================================
-->

<div class="modal fade"
     id="{{ modal_id|default:'confirmModal' }}"
     tabindex="-1"
     aria-labelledby="{{ modal_id|default:'confirmModal' }}Label"
     aria-describedby="{{ modal_id|default:'confirmModal' }}Description"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content app-modal">

            <div class="modal-header">

                <h5 class="modal-title"
                    id="{{ modal_id|default:'confirmModal' }}Label">

                    {{ title|default:"Confirmar acción" }}

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar">

                </button>

            </div>

            <div class="modal-body">

                <p  id="{{ modal_id|default:'confirmModal' }}Description"
                    class="mb-0">

                    {{ message|default:"¿Está seguro de continuar?" }}

                </p>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

                <form action="{{ confirm_url }}"
                      method="post"
                      autocomplete="off">

                    <input type="hidden"
                           name="{{ hidden_name|default:'id' }}"
                           value="{{ hidden_value|default:object_id }}">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-icon {{ confirm_class|default:'btn-danger' }}">

                        {% if confirm_icon %}

                            <i class="{{ confirm_icon }}"
                            aria-hidden="true">
                            </i>

                        {% endif %}

                        {{ confirm_text|default:"Confirmar" }}

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
